<text x="920" y="166" font-size="13" fill="#57606a">Theme switch</text>
<text x="920" y="184" font-size="13" fill="#57606a">(title bar, Settings)</text>
<text x="920" y="208" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2328">window.api.setTheme()</text>
<rect x="902" y="345" width="300" height="119" rx="10" fill="#fff" stroke="#8250df" stroke-width="2"/>
<rect x="902" y="345" width="6" height="119" rx="3" fill="#8250df"/>
<text x="920" y="371" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2328">'window:setTheme'</text>
<rect x="902" y="510" width="300" height="86" rx="10" fill="#fff" stroke="#bc4c00" stroke-width="2"/>
<rect x="902" y="510" width="6" height="86" rx="3" fill="#bc4c00"/>
<text x="920" y="536" font-size="12" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#1f2328">ipc/window.ts</text>
<text x="920" y="558" font-size="13" fill="#57606a">→ nativeTheme</text>
<text x="920" y="576" font-size="13" fill="#57606a">→ title bar colours</text>
<rect x="902" y="642" width="300" height="44" rx="10" fill="#fff" stroke="#1a7f37" stroke-width="2" stroke-dasharray="5 4"/>
<text x="1052" y="669" font-size="13" text-anchor="middle" fill="#1f2328">No data stored</text>
<path d="M1052 299 V342" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M1052 464 V507" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M1052 596 V639" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="40" y="720" font-size="13" fill="#57606a">Each arrow is one window.api call: preload invokes the channel, the handler unpacks the arguments and calls a service.</text>
<text x="40" y="740" font-size="13" fill="#57606a">Errors travel back as codes (e.g. PDF_EXPORT_FAILED) and the renderer shows them as error.* text.</text>
<text x="40" y="760" font-size="13" fill="#57606a">Zoom (window.api.zoom) uses webFrame inside the preload, with no IPC.</text>
</svg>
