<rect x="566" y="510" width="6" height="86" rx="3" fill="#bc4c00"/>
<text x="584" y="536" font-size="12" font-family="Consolas, Menlo, monospace" font-weight="700" fill="#1f2328">ipc/pdf.ts</text>
<text x="584" y="558" font-size="13" fill="#57606a">→ services/pdf/pdf-export.ts</text>
<text x="584" y="576" font-size="13" fill="#57606a">→ services/pdf/report-pdf.ts</text>
