<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="790" viewBox="0 0 1242 790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
<rect width="1242" height="790" fill="#ffffff"/>
<text x="40" y="58" font-size="28" font-weight="700" fill="#1f2328">Home Budget: how a click reaches the database</text>
<text x="40" y="84" font-size="14" fill="#57606a">The renderer only calls window.api; each call crosses the preload bridge as a 'domain:action' channel to a thin handler and its service.</text>
<rect x="40" y="118" width="170" height="181" rx="10" fill="#1f6feb"/>
<text x="54" y="148" font-size="19" font-weight="700" fill="#fff">Renderer</text>
<text x="54" y="168" font-size="12" fill="#fff">React UI · window.api only</text>
<rect x="40" y="345" width="170" height="119" rx="10" fill="#8250df"/>
<text x="54" y="375" font-size="19" font-weight="700" fill="#fff">Preload</text>
<text x="54" y="395" font-size="12" fill="#fff">contextBridge bridge</text>
<rect x="40" y="510" width="170" height="86" rx="10" fill="#bc4c00"/>
<text x="54" y="540" font-size="19" font-weight="700" fill="#fff">Main</text>
<text x="54" y="560" font-size="12" fill="#fff">ipc/&lt;domain&gt;.ts → services/</text>
<rect x="40" y="642" width="170" height="44" rx="10" fill="#1a7f37"/>
<text x="54" y="670" font-size="19" font-weight="700" fill="#fff">Data</text>
