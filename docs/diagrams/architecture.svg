<rect x="566" y="345" width="6" height="119" rx="3" fill="#8250df"/>
<text x="584" y="371" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2328">'pdf:export'</text>
<text x="584" y="388" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2328">'shell:openFile'</text>
