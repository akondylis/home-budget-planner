<text x="248" y="184" font-size="13" fill="#57606a">Title bar badge</text>
<text x="248" y="208" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2328">window.api.getSettings()</text>
<text x="248" y="225" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2328">window.api.setLanguage()</text>
<text x="248" y="242" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2328">window.api.setDateFormat()</text>
<text x="248" y="259" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1f2328">window.api.getAppInfo()</text>
